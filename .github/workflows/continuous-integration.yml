name: "Continuous Integration"

on:
  push:
  pull_request:

jobs:
  mago:
    name: "PHP ${{ matrix.php }} | ${{ matrix.dependencies }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: ['lowest', 'locked', 'latest']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP and Mago
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ (matrix.php == '8.4' && matrix.dependencies == 'locked') && 'pcov' || 'none' }}
          tools: mago

      # Resolve dependencies at the configured strategy level.
      # "locked" uses the committed composer.lock as-is.
      - name: Install dependencies (lowest)
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --no-interaction --no-progress

      - name: Install dependencies (locked)
        if: matrix.dependencies == 'locked'
        run: composer install --no-interaction --no-progress

      - name: Install dependencies (latest)
        if: matrix.dependencies == 'latest'
        run: composer update --no-interaction --no-progress

      # Set the Mago PHP version via env var so it overrides mago.toml
      # for each matrix PHP version without mutating the config file.
      - name: Pin Mago PHP version
        run: echo "MAGO_PHP_VERSION=${{ matrix.php }}" >> "$GITHUB_ENV"

      - name: Check formatting
        run: mago format --check

      - name: Lint
        if: success() || failure()
        run: mago lint

      - name: Analyze
        if: success() || failure()
        run: mago analyze

      - name: Guard
        if: success() || failure()
        run: mago guard

      - name: Test
        if: (success() || failure()) && !(matrix.php == '8.4' && matrix.dependencies == 'locked')
        run: ./vendor/bin/phpunit --colors=always

      - name: Test with coverage
        if: (success() || failure()) && matrix.php == '8.4' && matrix.dependencies == 'locked'
        run: composer test-coverage

      - name: Upload coverage to Codecov
        if: success() && matrix.php == '8.4' && matrix.dependencies == 'locked'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: clover.xml
          fail_ci_if_error: true

      - name: Mutation testing
        if: (success() || failure()) && matrix.php == '8.4' && matrix.dependencies == 'locked'
        env:
          INFECTION_DASHBOARD_API_KEY: ${{ secrets.INFECTION_DASHBOARD_API_KEY }}
        run: composer mutation-test -- --min-msi=90 --min-covered-msi=90 --logger-github
