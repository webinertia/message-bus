name: "Backward Compatibility Check"

on:
  push:
  pull_request:

jobs:
  roave-backward-compatibility-check:
    name: "Roave BC Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags are required so the tool can locate the last tagged version.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # SemVer gives no BC guarantee below 1.0.0, so only gate on tags >= 1.0.0.
      - name: Check for a comparable tag
        id: tag-check
        run: |
          if git tag -l | grep -Eq '^[1-9][0-9]*\.[0-9]+\.[0-9]+$'; then
            echo "has_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tag=false" >> "$GITHUB_OUTPUT"
          fi

      # BC is only a contract within a major line. A new major (e.g. 2.0.x vs the
      # latest 1.x tag) breaks intentionally, so skip the check until the first
      # tag on that major line exists.
      - name: Detect latest tag major
        id: tag-major
        run: |
          latest=$(git tag -l | grep -E '^[1-9][0-9]*\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          echo "major=${latest%%.*}" >> "$GITHUB_OUTPUT"

      - name: Detect current line major
        id: line-major
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            ref="$GITHUB_BASE_REF"
          else
            ref="$GITHUB_REF_NAME"
          fi
          ref="${ref#v}"
          echo "major=${ref%%.*}" >> "$GITHUB_OUTPUT"

      - name: Check for BC breaks
        if: steps.tag-check.outputs.has_tag == 'true' && steps.tag-major.outputs.major == steps.line-major.outputs.major
        run: vendor/bin/roave-backward-compatibility-check --format=github-actions
